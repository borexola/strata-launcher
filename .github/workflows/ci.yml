# Lint and tests on Linux and Windows, then a trial build of both downloads.
# Nothing here needs Strata, a model or a graphics card: the tests use the stand-in in tools/fake_strata.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -v

  windows-installer:
    name: Windows installer (WiX)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the MSI
        shell: pwsh
        run: packaging\windows\build.ps1
      - name: Build a second MSI with a higher version, to test an upgrade
        shell: pwsh
        run: packaging\windows\build.ps1 -AppDir out\dist\StrataLauncher -Version 99.0.0 -OutDir out\upgrade-test
      - name: Install it, run its self-test, upgrade, uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem out\*.msi | Select-Object -First 1).FullName
          $newer = (Get-ChildItem out\upgrade-test\*.msi | Select-Object -First 1).FullName
          packaging\windows\test-installer.ps1 -Msi $msi -NewerMsi $newer -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/*.msi
          if-no-files-found: error

  linux-download:
    name: Linux download
    needs: test
    runs-on: ubuntu-22.04      # an older system on purpose: the program then also runs on newer ones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Libraries Qt needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.6"
          packaging/linux/build.sh python
      - name: The packaged program passes its self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export STRATA_LAUNCHER_CONFIG_DIR="$RUNNER_TEMP/settings" FAKE_STRATA_HOME="$RUNNER_TEMP/fake" FAKE_STRATA_PYTHON=python
          python tools/make_demo_config.py "$STRATA_LAUNCHER_CONFIG_DIR"
          out/dist/strata-launcher/strata-launcher --selftest --selftest-seconds 3
      - uses: actions/upload-artifact@v4
        with:
          name: linux-download
          path: out/*.tar.gz
          if-no-files-found: error
