# Publishes a release when a tag like v1.2.3 is pushed: the Windows installer and the Linux download.
# The tag must match the version in src/strata_launcher/__init__.py.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/strata_launcher/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but the code says version $version. Change one of them." >&2
            exit 1
          fi
          if grep -q '^GITHUB_REPO = "OWNER/' src/strata_launcher/__init__.py; then
            echo "GITHUB_REPO in src/strata_launcher/__init__.py still has the placeholder owner. Set it to $GITHUB_REPOSITORY first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Tests (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -v

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - shell: pwsh
        run: packaging\windows\build.ps1 -ProjectUrl "https://github.com/${{ github.repository }}"
      - shell: pwsh
        run: packaging\windows\test-installer.ps1 -Msi (Get-ChildItem out\*.msi | Select-Object -First 1).FullName -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/*.msi
          if-no-files-found: error

  linux:
    name: Linux download
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.6"
          packaging/linux/build.sh python
      - uses: actions/upload-artifact@v4
        with:
          name: linux-download
          path: out/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "Strata Launcher ${GITHUB_REF_NAME#v}" --generate-notes
