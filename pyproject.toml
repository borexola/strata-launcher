[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-launcher"
dynamic = ["version"]
description = "A small desktop window to set up, start, stop and watch a Strata server. Unofficial companion to Strata."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
strata-launcher = "strata_launcher.cli:main"

[tool.setuptools.dynamic]
version = { attr = "strata_launcher.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strata_launcher = ["default_options.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E501"]   # long user-facing sentences stay on one line
